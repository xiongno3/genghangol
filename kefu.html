<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>联系客服</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            text-align: center;
            padding: 40px 15px;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 40%, #bfdbfe 75%, #eff6ff 100%);
            color: white;
            animation: fadeIn 0.8s ease-out;
        }
        h1 {
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            animation: fadeInDown 0.7s ease-out;
        }
        .image-link {
            display: inline-block;
            text-decoration: none;
            animation: fadeInUp 0.8s ease-out 0.3s both;
        }
        .image-link img {
            width: 200px;
            height: auto;
            border-radius: 20px;
            border: 4px solid rgba(255,255,255,0.7);
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.4s ease;
        }
        .image-link img:hover {
            transform: scale(1.08) translateY(-4px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.25);
        }
        .caption {
            margin-top: 20px;
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
            animation: fadeInUp 0.8s ease-out 0.7s both;
        }
        .back-btn:hover {
            background: white;
            color: #1e3a8a;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(59,130,246,0.4);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <h1>联系客服</h1>
    <a class="image-link" href="https://v.kuaishou.com/2CpGK9r" target="_blank">
        <img src="kuaishou_icon.jpg" alt="点击关注我们">
    </a>
    <div class="caption">点击图片关注我们，私信询问</div>
    <br>
    <a class="back-btn" href="index.html">返回首页</a>
</body>
</html>
