<!DOCTYPE html>

<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>全新UP角色 - 佳航（星耀）</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 40%, #bfdbfe 75%, #eff6ff 100%);
        color: white;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        text-align: center;
        padding: 30px 15px;
        animation: fadeIn 0.8s ease-out;
    }
    h1 {
        margin-top: 20px;
        font-size: 2.2em;
        text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        animation: fadeInDown 0.8s ease-out;
    }
    img {
        margin-top: 30px;
        max-width: 90%;
        height: auto;
        border-radius: 16px;
        border: 4px solid rgba(255,255,255,0.8);
        box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.4s ease;
        animation: fadeIn 1s ease-out 0.2s both;
    }
    img:hover {
        transform: scale(1.02);
        box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 24px;
        color: white;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255,255,255,0.6);
        border-radius: 10px;
        text-decoration: none;
        font-size: 16px;
        transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    a:hover {
        background: white;
        color: #1e3a8a;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(59,130,246,0.4);
    }
    .video-link {
        margin-top: 15px;
        font-size: 20px;
        color: #fbbf24;
        border-color: #fbbf24;
    }
    .video-link:hover {
        background: #fbbf24;
        color: #1e3a8a;
        border-color: #fbbf24;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<audio autoplay="" id="bgm" loop="" src="1748676850704.mp3"></audio>
<div id="musicPrompt" style="display:none;position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
background:#000;color:#fff;padding:15px 25px;border-radius:10px;z-index:9999;font-size:18px;">
🔊 点击开启音乐
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var audio = document.getElementById("bgm");
  var musicPrompt = document.getElementById("musicPrompt");
  function tryPlay() {
    audio.play().then(() => {
      musicPrompt.style.display = "none";
    }).catch(() => {
      musicPrompt.style.display = "block";
      document.body.addEventListener("click", function onceClick() {
        audio.play();
        musicPrompt.style.display = "none";
        document.body.removeEventListener("click", onceClick);
      });
    });
  }
  tryPlay();
});
</script>

<h1>全新UP角色：佳航（星耀）</h1>
<img alt="佳航（星耀）" src="up_character.jpg"/>

<a href="index.html">← 返回首页</a>
<p><a class="video-link" href="video.html">▶ 预览宣传视频</a></p>
</body>
</html>
